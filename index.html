
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIN IMAGE ENGINE</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px;
  background: #101216;
  color: #e9edf2;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}
main { max-width: 650px; margin: auto; }
h1 { font-size: 25px; margin-bottom: 5px; }
.sub { color: #929ba8; font-size: 13px; margin-bottom: 24px; }
.panel {
  background: #1b2028;
  border: 1px solid #303946;
  border-radius: 14px;
  padding: 16px;
  margin: 14px 0;
}
button, .file {
  display: block;
  width: 100%;
  border: 0;
  border-radius: 10px;
  padding: 14px;
  background: #8b5cf6;
  color: white;
  font-size: 15px;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
}
.file { background: #303947; margin-bottom: 12px; }
input { display: none; }
button:disabled { opacity: .5; }
img {
  display: none;
  width: 100%;
  max-height: 320px;
  object-fit: contain;
  border-radius: 10px;
  margin-top: 12px;
}
#status { color: #a9b5c4; font-size: 13px; }
#results { line-height: 1.6; }
.result {
  padding: 10px 0;
  border-bottom: 1px solid #303946;
}
.result:last-child { border: 0; }
.score { color: #a78bfa; float: right; }
#log {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: #9eabb9;
  font: 12px/1.6 monospace;
}
.small { color: #8995a3; font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>BIN IMAGE ENGINE</h1>
  <div class="sub">Mobile Edition · Local inference · WASM</div>

  <div class="panel">
    <label class="file" for="photo">Выбрать фотографию</label>
    <input id="photo" type="file" accept="image/*">
    <img id="preview" alt="Предпросмотр">
    <p id="status">Загрузка движка...</p>
    <button id="run" disabled>Распознать изображение</button>
  </div>

  <div class="panel">
    <b>Результаты</b>
    <div id="results" class="small">Пока нет результатов.</div>
  </div>

  <div class="panel">
    <b>Журнал BIN Engine</b>
    <p id="log">Инициализация...</p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
<script>
"use strict";

const MODEL_URL =
  "https://huggingface.co/webnn/mobilenet-v2/resolve/main/onnx/mobilenetv2-10.onnx";

const LABELS_URL =
  "https://raw.githubusercontent.com/anishathalye/imagenet-simple-labels/master/imagenet-simple-labels.json";

const DB_NAME = "BIN_ENGINE_STORAGE";
const DB_VERSION = 1;
const MODEL_KEY = "mobilenetv2-10-v1";
const LABELS_KEY = "imagenet-labels-v1";

const $ = id => document.getElementById(id);

let session = null;
let selectedImage = null;
let labels = null;

function log(message) {
  $("log").textContent += "\n" + message;
}

function status(message) {
  $("status").textContent = message;
}

function openDB() {
  return new Promise((resolve, reject) => {
    if (!("indexedDB" in window)) {
      reject(new Error("IndexedDB недоступна"));
      return;
    }

    const request = indexedDB.open(DB_NAME, DB_VERSION);

    request.onupgradeneeded = () => {
      const db = request.result;
      if (!db.objectStoreNames.contains("assets")) {
        db.createObjectStore("assets", { keyPath: "key" });
      }
    };

    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function dbGet(key) {
  const db = await openDB();

  return new Promise((resolve, reject) => {
    const tx = db.transaction("assets", "readonly");
    const request = tx.objectStore("assets").get(key);

    request.onsuccess = () => {
      resolve(request.result ? request.result.value : null);
    };

    request.onerror = () => reject(request.error);
    tx.oncomplete = () => db.close();
  });
}

async function dbPut(key, value) {
  const db = await openDB();

  return new Promise((resolve, reject) => {
    const tx = db.transaction("assets", "readwrite");
    tx.objectStore("assets").put({ key, value });

    tx.oncomplete = () => {
      db.close();
      resolve(true);
    };

    tx.onerror = () => {
      db.close();
      reject(tx.error);
    };

    tx.onabort = () => {
      db.close();
      reject(tx.error || new Error("Запись отменена"));
    };
  });
}

async function loadModelBytes() {
  try {
    const cached = await dbGet(MODEL_KEY);

    if (cached instanceof ArrayBuffer && cached.byteLength > 0) {
      log("Модель найдена в IndexedDB.");
      log("Размер: " + (cached.byteLength / 1048576).toFixed(2) + " MB");
      return cached;
    }
  } catch (error) {
    log("Кэш недоступен: " + error.message);
  }

  log("Скачиваю MobileNetV2...");
  status("Скачивание модели...");

  const response = await fetch(MODEL_URL);

  if (!response.ok) {
    throw new Error("Не удалось скачать модель: HTTP " + response.status);
  }

  const buffer = await response.arrayBuffer();

  if (!buffer.byteLength) {
    throw new Error("Получена пустая модель");
  }

  log("Модель загружена: " +
      (buffer.byteLength / 1048576).toFixed(2) + " MB");

  try {
    await dbPut(MODEL_KEY, buffer);
    log("Модель сохранена в IndexedDB.");
  } catch (error) {
    log("Не удалось сохранить модель: " + error.message);
    log("Продолжаю работу без постоянного кэша.");
  }

  return buffer;
}

async function loadLabels() {
  try {
    const cached = await dbGet(LABELS_KEY);

    if (Array.isArray(cached) && cached.length === 1000) {
      log("Названия классов загружены из IndexedDB.");
      return cached;
    }
  } catch (error) {
    log("Кэш названий недоступен.");
  }

  log("Загружаю названия классов...");

  const response = await fetch(LABELS_URL);

  if (!response.ok) {
    throw new Error("Не удалось загрузить список классов");
  }

  const data = await response.json();

  if (!Array.isArray(data) || data.length !== 1000) {
    throw new Error("Неверный формат списка классов");
  }

  try {
    await dbPut(LABELS_KEY, data);
    log("Названия классов сохранены в IndexedDB.");
  } catch (error) {
    log("Не удалось сохранить названия классов.");
  }

  return data;
}

async function initialize() {
  try {
    log("Запуск BIN Engine...");

    if (!window.ort) {
      throw new Error("ONNX Runtime не загрузился");
    }

    ort.env.wasm.numThreads = 1;
    ort.env.wasm.simd = true;

    log("ONNX Runtime загружен.");

    const modelBytes = await loadModelBytes();

    status("Создание WASM inference session...");
    log("Создаю WASM inference session...");

    const start = performance.now();

    session = await ort.InferenceSession.create(
      new Uint8Array(modelBytes),
      {
        executionProviders: ["wasm"],
        graphOptimizationLevel: "all"
      }
    );

    log("Сессия создана за " +
        (performance.now() - start).toFixed(1) + " ms");

    log("Вход: " + session.inputNames[0]);
    log("Выход: " + session.outputNames[0]);

    labels = await loadLabels();

    status("BIN Engine готов к работе.");
    $("run").disabled = !selectedImage;

    log("Инициализация завершена.");
  } catch (error) {
    status("Ошибка запуска: " + error.message);
    log("ОШИБКА: " + error.stack);
  }
}

$("photo").addEventListener("change", event => {
  const file = event.target.files[0];
  if (!file) return;

  const url = URL.createObjectURL(file);

  $("preview").src = url;
  $("preview").style.display = "block";

  selectedImage = new Image();

  selectedImage.onload = () => {
    status(session ? "Фотография готова." : "Фотография загружена. Ждём движок.");
    $("run").disabled = !session;
  };

  selectedImage.onerror = () => {
    status("Не удалось открыть фотографию.");
    selectedImage = null;
  };

  selectedImage.src = url;
});

function prepareTensor(image) {
  const size = 224;
  const canvas = document.createElement("canvas");
  canvas.width = size;
  canvas.height = size;

  const ctx = canvas.getContext("2d", {
    willReadFrequently: true
  });

  const scale = Math.max(
    size / image.naturalWidth,
    size / image.naturalHeight
  );

  const width = image.naturalWidth * scale;
  const height = image.naturalHeight * scale;

  const x = (size - width) / 2;
  const y = (size - height) / 2;

  ctx.drawImage(image, x, y, width, height);

  const pixels = ctx.getImageData(0, 0, size, size).data;
  const tensorData = new Float32Array(3 * size * size);

  const mean = [0.485, 0.456, 0.406];
  const std = [0.229, 0.224, 0.225];

  for (let i = 0; i < size * size; i++) {
    for (let c = 0; c < 3; c++) {
      const value = pixels[i * 4 + c] / 255;
      tensorData[c * size * size + i] =
        (value - mean[c]) / std[c];
    }
  }

  return new ort.Tensor("float32", tensorData, [1, 3, 224, 224]);
}

function softmax(values) {
  let max = -Infinity;

  for (const value of values) {
    if (value > max) max = value;
  }

  const result = new Float64Array(values.length);
  let sum = 0;

  for (let i = 0; i < values.length; i++) {
    result[i] = Math.exp(values[i] - max);
    sum += result[i];
  }

  for (let i = 0; i < result.length; i++) {
    result[i] /= sum;
  }

  return result;
}

async function classify() {
  if (!session || !selectedImage) return;

  $("run").disabled = true;
  $("results").textContent = "Выполняется распознавание...";
  status("Обрабатываю изображение...");

  try {
    log("Подготавливаю RGB-тензор...");

    const tensor = prepareTensor(selectedImage);

    log("Тензор: 1 × 3 × 224 × 224");
    log("Запускаю inference через WASM...");

    const start = performance.now();

    const output = await session.run({
      [session.inputNames[0]]: tensor
    });

    const elapsed = performance.now() - start;
    const raw = output[session.outputNames[0]].data;

    log("Inference завершён.");
    log("Время inference: " + elapsed.toFixed(1) + " ms");
    log("Количество классов: " + raw.length);

    const probabilities = softmax(raw);

    const top = Array.from(probabilities, (score, index) => ({
      index,
      score
    }))
    .sort((a, b) => b.score - a.score)
    .slice(0, 5);

    $("results").innerHTML = "";

    for (const item of top) {
      const row = document.createElement("div");
      row.className = "result";

      const name = document.createElement("span");
      name.textContent = labels[item.index] || ("Класс " + item.index);

      const score = document.createElement("span");
      score.className = "score";
      score.textContent = (item.score * 100).toFixed(2) + "%";

      row.append(name, score);
      $("results").appendChild(row);
    }

    log("Распознавание завершено.");
    status("Готово.");
  } catch (error) {
    status("Ошибка распознавания.");
    log("ОШИБКА: " + error.stack);
    $("results").textContent = error.message;
  } finally {
    $("run").disabled = !session || !selectedImage;
  }
}

$("run").addEventListener("click", classify);

initialize();
</script>
</body>
</html>
