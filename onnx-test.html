
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIN — MobileNet Benchmark</title>
<style>
* { box-sizing: border-box; }
body {
  background:#101116;color:#f2f3f7;
  font-family:-apple-system,sans-serif;
  padding:22px;margin:0;
}
main { max-width:650px;margin:auto; }
p { color:#adb3c2;line-height:1.5; }
button {
  width:100%;padding:18px;margin:9px 0;
  border:0;border-radius:14px;
  background:#7455e8;color:white;
  font-size:17px;font-weight:700;
}
button:disabled { opacity:.45; }
.panel {
  background:#1b1d26;border:1px solid #343743;
  border-radius:16px;padding:20px;margin-top:18px;
}
pre {
  white-space:pre-wrap;overflow-wrap:anywhere;
  color:#c2cada;font-size:13px;line-height:1.6;
}
.good {color:#8ce5ad;}
.bad {color:#ff8585;}
</style>
</head>
<body>
<main>
<h1>BIN IMAGE ENGINE</h1>
<p>MobileNetV2 — тест производительности iPhone.</p>

<button id="wasm">ЗАПУСТИТЬ WASM (CPU)</button>
<button id="webgl">ЗАПУСТИТЬ WEBGL</button>

<section class="panel">
<h2>Результат</h2>
<p id="status">Ожидание теста...</p>
<pre id="log">Модель ещё не загружена.</pre>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
<script>
const $ = id => document.getElementById(id);

const MODEL =
"https://huggingface.co/webnn/mobilenet-v2/resolve/main/onnx/mobilenetv2-10.onnx";

const CDN =
"https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/";

let modelBytes = null;
let busy = false;

function log(s) {
  $("log").textContent += "\n" + s;
}

async function test(provider) {
  if (busy) return;
  busy = true;

  $("wasm").disabled = true;
  $("webgl").disabled = true;
  $("log").textContent = "Начинаю тест...";
  $("status").textContent = "Выполняется...";
  $("status").className = "";

  let session = null;

  try {
    if (!window.ort) {
      throw new Error("ONNX Runtime не загрузился.");
    }

    ort.env.wasm.wasmPaths = CDN;

    log("ONNX Runtime загружен.");
    log("Backend: " + provider);

    if (!modelBytes) {
      log("Скачиваю MobileNetV2...");

      const response = await fetch(MODEL);

      if (!response.ok) {
        throw new Error("HTTP " + response.status +
          " при скачивании модели.");
      }

      modelBytes = await response.arrayBuffer();

      log("Размер модели: " +
        (modelBytes.byteLength / 1048576).toFixed(2) +
        " MB");
    }

    log("Создаю inference session...");
    const sessionStart = performance.now();

    session = await ort.InferenceSession.create(
      modelBytes,
      {
        executionProviders: [provider],
        graphOptimizationLevel: "all"
      }
    );

    log("Сессия создана за " +
      (performance.now() - sessionStart).toFixed(1) + " ms");

    const inputName = session.inputNames[0];
    const outputName = session.outputNames[0];

    log("Вход: " + inputName);
    log("Выход: " + outputName);

    // MobileNetV2: RGB, 224 × 224, формат NCHW
    const dims = [1, 3, 224, 224];
    const count = 1 * 3 * 224 * 224;
    const data = new Float32Array(count);

    // Детерминированный тестовый вход
    for (let i = 0; i < count; i++) {
      data[i] = ((i * 17) % 255) / 255;
    }

    const input = new ort.Tensor(
      "float32", data, dims
    );

    log("Входной тензор: " + dims.join(" × "));
    log("Прогрев модели...");

    await session.run({
      [inputName]: input
    });

    log("Прогрев завершён.");
    log("Запускаю 3 измерения...");

    const times = [];

    for (let i = 0; i < 3; i++) {
      const start = performance.now();

      const result = await session.run({
        [inputName]: input
      });

      const elapsed = performance.now() - start;
      times.push(elapsed);

      const output = result[outputName];

      if (!output) {
        throw new Error("Выходной тензор отсутствует.");
      }

      log("Запуск " + (i + 1) + ": " +
        elapsed.toFixed(1) + " ms");

      log("Размер выхода: " +
        output.dims.join(" × "));
    }

    const average =
      times.reduce((a,b) => a+b, 0) / times.length;

    log("Среднее время: " + average.toFixed(1) + " ms");
    log("Лучшее время: " + Math.min(...times).toFixed(1) + " ms");

    $("status").textContent =
      "УСПЕХ — " + provider.toUpperCase();
    $("status").className = "good";

  } catch (e) {
    $("status").textContent = "ОШИБКА";
    $("status").className = "bad";
    log("ОШИБКА: " + (e.message || String(e)));
    console.error(e);
  } finally {
    if (session) {
      try { await session.release(); }
      catch(e) { log("Ошибка закрытия: " + e.message); }
    }

    busy = false;
    $("wasm").disabled = false;
    $("webgl").disabled = false;
  }
}

$("wasm").onclick = () => test("wasm");
$("webgl").onclick = () => test("webgl");
</script>
</body>
</html>
