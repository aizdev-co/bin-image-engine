
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIN — ONNX Test</title>

<style>
* { box-sizing: border-box; }

body {
  background: #101116;
  color: #f2f3f7;
  font-family: -apple-system, sans-serif;
  padding: 22px;
  margin: 0;
}

main {
  max-width: 650px;
  margin: auto;
}

p {
  color: #aeb3c1;
  line-height: 1.5;
}

button {
  width: 100%;
  padding: 18px;
  margin: 9px 0;
  border: 0;
  border-radius: 14px;
  background: #7455e8;
  color: white;
  font-size: 17px;
  font-weight: 700;
}

button:disabled {
  opacity: 0.5;
}

.panel {
  background: #1b1d26;
  border: 1px solid #343743;
  border-radius: 16px;
  padding: 20px;
  margin-top: 18px;
}

pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: #bfc9d9;
  font-size: 13px;
  line-height: 1.55;
}

.good { color: #8ce5ad; }
.bad { color: #ff8585; }
</style>
</head>

<body>
<main>

<h1>BIN IMAGE ENGINE</h1>

<p>
Проверка реального запуска ONNX-модели на iPhone.
</p>

<button id="webgl">ЗАПУСТИТЬ ЧЕРЕЗ WEBGL</button>
<button id="wasm">ЗАПУСТИТЬ ЧЕРЕЗ WASM (CPU)</button>

<section class="panel">
<h2>Результат</h2>
<p id="status">Ожидание теста...</p>
<pre id="log">ONNX Runtime пока не загружен.</pre>
</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>

<script>
const $ = id => document.getElementById(id);

const MODEL =
"https://cdn.jsdelivr.net/gh/microsoft/onnxruntime-inference-examples@main/c_cxx/MNIST/mnist.onnx";

const CDN =
"https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/";

let modelBytes = null;
let running = false;

function log(message) {
  $("log").textContent += "\n" + message;
}

async function runTest(provider) {

  if (running) return;
  running = true;

  $("webgl").disabled = true;
  $("wasm").disabled = true;

  $("log").textContent = "Начинаю тест...";
  $("status").textContent = "Выполняется...";
  $("status").className = "";

  let session = null;

  try {

    if (!window.ort) {
      throw new Error(
        "ONNX Runtime не загрузился. Проверь интернет."
      );
    }

    ort.env.wasm.wasmPaths = CDN;

    log("ONNX Runtime: библиотека загружена");
    log("Execution Provider: " + provider);

    if (!modelBytes) {

      log("Скачиваю тестовую модель MNIST...");

      const response = await fetch(MODEL);

      if (!response.ok) {
        throw new Error(
          "Ошибка загрузки модели: HTTP " + response.status
        );
      }

      modelBytes = await response.arrayBuffer();

      log(
        "Модель загружена: " +
        (modelBytes.byteLength / 1024).toFixed(1) +
        " KB"
      );
    }

    log("Создаю inference session...");

    session = await ort.InferenceSession.create(
      modelBytes,
      {
        executionProviders: [provider],
        graphOptimizationLevel: "all"
      }
    );

    log("Сессия создана.");

    const inputName = session.inputNames[0];
    const outputName = session.outputNames[0];

    if (!inputName || !outputName) {
      throw new Error("Не удалось определить вход или выход модели.");
    }

    log("Входы: " + session.inputNames.join(", "));
    log("Выходы: " + session.outputNames.join(", "));

    // MNIST: один канал, изображение 28 × 28
    const dims = [1, 1, 28, 28];

    const count = dims.reduce(
      (a, b) => a * b, 1
    );

    // Тестовое изображение с небольшими ненулевыми значениями
    const inputData = new Float32Array(count);

    for (let i = 0; i < count; i++) {
      inputData[i] = 0;
    }

    const input = new ort.Tensor(
      "float32",
      inputData,
      dims
    );

    log("Входной тензор: " + dims.join(" × "));
    log("Создан тестовый вход.");
    log("Выполняю inference...");

    const start = performance.now();

    const output = await session.run({
      [inputName]: input
    });

    const elapsed = performance.now() - start;

    const result = output[outputName];

    if (!result) {
      throw new Error("Модель не вернула ожидаемый выход.");
    }

    log("Вычисление завершено!");
    log("Время: " + elapsed.toFixed(1) + " ms");
    log("Размер выхода: " + result.dims.join(" × "));

    log(
      "Первые значения: " +
      Array.from(result.data.slice(0, 10))
        .map(x => Number(x).toFixed(4))
        .join(", ")
    );

    $("status").textContent =
      "УСПЕХ — " + provider.toUpperCase();

    $("status").className = "good";

  } catch (error) {

    $("status").textContent = "ОШИБКА";
    $("status").className = "bad";

    log("ОШИБКА: " + (error.message || String(error)));

    console.error(error);

  } finally {

    if (session) {
      try {
        await session.release();
      } catch (e) {
        log("Предупреждение при закрытии сессии: " + e.message);
      }
    }

    running = false;
    $("webgl").disabled = false;
    $("wasm").disabled = false;
  }
}

$("webgl").onclick = () => runTest("webgl");
$("wasm").onclick = () => runTest("wasm");

</script>
</body>
</html>
