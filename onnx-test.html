
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIN — ONNX Test</title>
<style>
body {
  background:#101116;color:#f2f3f7;
  font-family:-apple-system,sans-serif;
  padding:22px;margin:0;
}
main{max-width:650px;margin:auto}
p{color:#aeb3c1;line-height:1.5}
button{
  width:100%;padding:16px;margin:8px 0;
  border:0;border-radius:12px;
  background:#7455e8;color:white;
  font-size:16px;font-weight:700;
}
.panel{
  background:#1b1d26;border:1px solid #343743;
  border-radius:15px;padding:18px;margin-top:16px;
}
pre{
  white-space:pre-wrap;overflow-wrap:anywhere;
  color:#bfc9d9;font-size:12px;line-height:1.5;
}
.good{color:#8ce5ad}
.bad{color:#ff8585}
</style>
</head>
<body>
<main>
<h1>BIN IMAGE ENGINE</h1>
<p>Проверка реального запуска ONNX-модели на iPhone.</p>

<button id="webgl">ЗАПУСТИТЬ ЧЕРЕЗ WEBGL</button>
<button id="wasm">ЗАПУСТИТЬ ЧЕРЕЗ WASM (CPU)</button>

<section class="panel">
<h2>Результат</h2>
<p id="status">Ожидание теста...</p>
<pre id="log">ONNX Runtime пока не загружен.</pre>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
<script>
const $ = id => document.getElementById(id);

const MODEL =
"https://cdn.jsdelivr.net/gh/microsoft/onnxruntime-inference-examples@main/c_cxx/MNIST/mnist.onnx";

const CDN =
"https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/";

let modelBytes = null;

function log(s) {
  $("log").textContent += "\n" + s;
}

async function runTest(provider) {
  $("log").textContent = "Начинаю тест...";
  $("status").textContent = "Выполняется...";
  $("status").className = "";

  try {
    if (!window.ort) {
      throw new Error("ONNX Runtime не загрузился. Проверь интернет.");
    }

    ort.env.wasm.wasmPaths = CDN;

    log("ONNX Runtime: " + ort.version);
    log("Execution Provider: " + provider);

    if (!modelBytes) {
      log("Скачиваю тестовую модель MNIST...");
      const response = await fetch(MODEL);

      if (!response.ok) {
        throw new Error("Ошибка загрузки модели: HTTP " + response.status);
      }

      modelBytes = await response.arrayBuffer();
      log("Модель загружена: " +
        (modelBytes.byteLength / 1024).toFixed(1) + " KB");
    }

    log("Создаю inference session...");

    const session = await ort.InferenceSession.create(
      modelBytes,
      {
        executionProviders: [provider],
        graphOptimizationLevel: "all"
      }
    );

    log("Сессия создана.");
    log("Входы: " + session.inputNames.join(", "));
    log("Выходы: " + session.outputNames.join(", "));

    const inputName = session.inputNames[0];
    const metadata = session.inputMetadata[0];
    const dims = metadata.dims.map(d =>
      typeof d === "number" ? d : 1
    );

    const count = dims.reduce((a,b) => a*b, 1);
    const input = new ort.Tensor(
      "float32",
      new Float32Array(count),
      dims
    );

    log("Входной тензор: " + dims.join(" × "));
    log("Выполняю inference...");

    const start = performance.now();

    const output = await session.run({
      [inputName]: input
    });

    const elapsed = performance.now() - start;
    const outputName = session.outputNames[0];
    const result = output[outputName];

    log("Вычисление завершено!");
    log("Время: " + elapsed.toFixed(1) + " ms");
    log("Размер выхода: " + result.dims.join(" × "));
    log("Первые значения: " +
      Array.from(result.data.slice(0,10))
        .map(x => Number(x).toFixed(4)).join(", "));

    $("status").textContent =
      "УСПЕХ — " + provider.toUpperCase();
    $("status").className = "good";

    await session.release();

  } catch (error) {
    $("status").textContent = "ОШИБКА";
    $("status").className = "bad";
    log("ОШИБКА: " + error.message);
    console.error(error);
  }
}

$("webgl").onclick = () => runTest("webgl");
$("wasm").onclick = () => runTest("wasm");
</script>
</body>
</html>
